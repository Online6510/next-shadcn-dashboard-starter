name: Prepare Supabase and AI SDK dependencies
on:
  push:
    branches: [feat/wanderly-supabase-production]
    paths:
      - '.github/workflows/wanderly-backend-deps.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependency set and generate lockfile
        run: |
          bun add --exact @supabase/ssr @supabase/supabase-js ai
          bun install --frozen-lockfile
      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --quiet || git commit -m "chore(wanderly): lock Supabase SSR and AI SDK dependencies"
          git push origin HEAD:feat/wanderly-supabase-production
