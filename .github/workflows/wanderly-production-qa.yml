name: Wanderly Supabase production QA
on:
  push:
    branches: [feat/wanderly-supabase-production]
  pull_request:
    branches: [feat/wanderly-visual-fidelity-v3]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.5' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.4' }
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
