name: Wanderly V3 QA

on:
  push:
    branches:
      - feat/wanderly-visual-fidelity-v3
  pull_request:
    branches:
      - feat/wanderly-premium-v2

jobs:
  check:
    name: Typecheck, build, regression and visual screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit and integration tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser QA on isolated SQLite
        run: |
          mkdir -p /tmp/wanderly-v3-qa
          WANDERLY_DATA_DIR=/tmp/wanderly-v3-qa bun run start --hostname 127.0.0.1 --port 3100 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 2
          done
          echo 'Visual QA and screenshot capture'
          timeout 180s node scripts/check-v3.cjs
          echo 'V2 full interactive regression'
          timeout 240s node scripts/check-v2.cjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanderly-v3-screenshots
          path: docs/screenshots/v3/
          if-no-files-found: ignore
