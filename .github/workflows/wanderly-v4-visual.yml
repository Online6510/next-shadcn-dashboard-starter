name: Wanderly V4 Visual QA
on:
  push:
    branches:
      - feat/wanderly-v4-atlas-experience
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify
        run: |
          bun test
          bun run typecheck
          bun run lint
          bun run build
      - name: Browser
        run: bunx playwright install --with-deps chromium
      - name: Render real responsive screenshots
        run: |
          mkdir -p docs/screenshots/v4
          WANDERLY_VISUAL_PREVIEW=1 bun run start --hostname 127.0.0.1 --port 3100 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 2
          done
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 1100 http://127.0.0.1:3100/ docs/screenshots/v4/home-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 1100 http://127.0.0.1:3100/explore docs/screenshots/v4/explore-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 1100 http://127.0.0.1:3100/login docs/screenshots/v4/login-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 1800 http://127.0.0.1:3100/map docs/screenshots/v4/map-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 1600 http://127.0.0.1:3100/design-review-v4/trip docs/screenshots/v4/trip-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 900 http://127.0.0.1:3100/design-review-v4/ai docs/screenshots/v4/ai-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 900 http://127.0.0.1:3100/design-review-v4/journal docs/screenshots/v4/journal-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "1440,900" \
            --wait-for-timeout 900 http://127.0.0.1:3100/design-review-v4/budget docs/screenshots/v4/budget-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 1100 http://127.0.0.1:3100/ docs/screenshots/v4/home-mobile.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 1100 http://127.0.0.1:3100/explore docs/screenshots/v4/explore-mobile.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 1100 http://127.0.0.1:3100/login docs/screenshots/v4/login-mobile.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 1600 http://127.0.0.1:3100/map docs/screenshots/v4/map-mobile.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 1400 http://127.0.0.1:3100/design-review-v4/trip docs/screenshots/v4/trip-mobile.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 900 http://127.0.0.1:3100/design-review-v4/ai docs/screenshots/v4/ai-mobile.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 900 http://127.0.0.1:3100/design-review-v4/journal docs/screenshots/v4/journal-mobile.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" \
            --wait-for-timeout 900 http://127.0.0.1:3100/design-review-v4/budget docs/screenshots/v4/budget-mobile.png
          # Tablet and compact-screen references complement 1440px/390px checks.
          bunx playwright screenshot --browser chromium --viewport-size "1024,768" \
            --wait-for-timeout 1000 http://127.0.0.1:3100/ docs/screenshots/v4/home-tablet-wide.png
          bunx playwright screenshot --browser chromium --viewport-size "768,1024" \
            --wait-for-timeout 1000 http://127.0.0.1:3100/ docs/screenshots/v4/home-tablet.png
          bunx playwright screenshot --browser chromium --viewport-size "768,1024" \
            --wait-for-timeout 1200 http://127.0.0.1:3100/map docs/screenshots/v4/map-tablet.png
          bunx playwright screenshot --browser chromium --viewport-size "768,1024" \
            --wait-for-timeout 1300 http://127.0.0.1:3100/design-review-v4/trip docs/screenshots/v4/trip-tablet.png
          bunx playwright screenshot --browser chromium --viewport-size "360,780" \
            --wait-for-timeout 1000 http://127.0.0.1:3100/login docs/screenshots/v4/login-compact.png
      - name: Interactive browser regression
        run: |
          WANDERLY_VISUAL_PREVIEW=1 bun run start --hostname 127.0.0.1 --port 3100 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 2
          done
          timeout 150s node scripts/check-v4-browser.cjs
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanderly-v4-visual-screenshots
          path: docs/screenshots/v4/
          if-no-files-found: ignore
